meta:
  title: "Стас Ганиев, спикер: темы докладов, био, фото" # M3
  description: "Темы докладов о 1С и AI, био в трёх длинах и фото для анонса. Список из {talks|выступления|выступлений|выступлений} с записями и презентациями." # M4

head:
  title: "Стас Ганиев, спикер" # S0
  lead: "Рассказываю о разработке на 1С и применении AI. На этой странице собрано всё, что нужно организатору: темы, био и фото." # S1
  invite: "Пригласить выступить" # S10
  video: "Видео-самопрезентация (YouTube)" # S8a

bio:
  title: "Био" # S2
  copy: "Скопировать"
  copied: "Скопировано"
  variants:
    - label: "Одна строка" # S3
      text:
        - "Стас Ганиев, Senior 1С-разработчик в SOFTSWISS, автор курсов «AI-арсенал для разработчика 1С» и «Git и GitHub в 1С-разработке»."
    - label: "Абзац" # S4
      text:
        - "Стас Ганиев работает с 1С с {sinceYear} года. Прошёл путь от программиста во франчайзи до архитектора и руководителя группы разработки в крупнейшем ритейл-холдинге Дальнего Востока. Сейчас он Senior 1С-разработчик в международной продуктовой компании SOFTSWISS, живёт в Сербии. Автор двух курсов для 1С-разработчиков, их прошли {graduates|человек|человека|человек}. Выступил с {talks|докладом|докладами|докладами}, в том числе дважды на Infostart Event, и написал {articles|статью|статьи|статей}."
    - label: "Полстраницы" # S5
      text:
        - "Стас Ганиев работает с 1С с {sinceYear} года. Начинал во франчайзи 1С: внедрял типовые конфигурации и стал первым преподавателем учебного центра. Девять лет проработал в «Неваде», крупнейшем ритейл-холдинге Дальнего Востока: руководил группой разработки, внедрил расчёт зарплаты для {payrollEmployees} сотрудников в {payrollBranches} филиалах, ввёл групповую разработку с Git и написал корпоративные стандарты кода."
        - "С {movedToSerbiaYear} года Стас живёт в Сербии и работает в международных продуктовых командах: сначала в 1C Romania, сейчас в SOFTSWISS на позиции Senior 1C Developer."
        - "Стас ведёт два авторских курса для 1С-разработчиков: «AI-арсенал для разработчика 1С» и «Git и GitHub в 1С-разработке». Их прошли {graduates|человек|человека|человек}. Он выступил с {talks|докладом|докладами|докладами}, в том числе дважды на Infostart Event, и написал {articles|статью|статьи|статей}. Статья о Git и 1С номинирована на «Статью года 2019» на Инфостарте. Сооснователь дальневосточного IT-сообщества DevDV, организовал {conferencesTotal|конференцию|конференции|конференций}: {conferencesCorporate|корпоративную|корпоративные|корпоративных} и {conferencesOpen|открытую|открытые|открытых}."

topics:
  title: "Темы докладов" # S6
  items:
    - title: "От кода до коммерческого предложения: как построить AI-конвейер для любого бизнес-процесса"
      text: "Шесть вопросов, по которым можно разобрать собственный процесс и понять, где в нём место AI. На трёх работающих примерах: разработка на 1С, производство курса, семейные финансы. Для руководителей и команд."
    - title: "Экономика AI в 1С-проекте"
      text: "AI ускорил разработку. Почему проект не подешевел во столько же раз? Полная стоимость AI-разработки: токены, часы и переделки. Для руководителей проектов и владельцев бизнеса."
  format: "Формат: 30–40 минут, офлайн или онлайн. Выступаю на русском языке." # S7

