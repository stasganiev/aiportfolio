      text:
        - "Stas Ganiev, Senior 1C Developer u kompaniji SOFTSWISS, autor kurseva „AI arsenal za 1C programera“ i „Git i GitHub u 1C razvoju“."
    - label: "Pasus" # S4
      text:
        - "Stas Ganiev radi sa 1C-om od {sinceYear}. godine. Prošao je put od programera kod 1C franšiznog partnera do arhitekte i rukovodioca razvojnog tima u najvećem maloprodajnom holdingu ruskog Dalekog istoka. Sada je Senior 1C Developer u međunarodnoj produktnoj kompaniji SOFTSWISS i živi u Srbiji. Autor je dva kursa za 1C programere, koje je završilo {graduates|polaznik|polaznika|polaznika}. Održao je {talks|predavanje|predavanja|predavanja}, od toga dva na Infostart Event-u, i napisao {articles|članak|članka|članaka}."
    - label: "Pola strane" # S5
      text:
        - "Stas Ganiev radi sa 1C-om od {sinceYear}. godine. Počeo je kod 1C franšiznih partnera: uvodio je standardne konfiguracije i postao prvi predavač obrazovnog centra. Devet godina je radio u Nevadi, najvećem maloprodajnom holdingu ruskog Dalekog istoka: vodio je razvojni tim, uveo obračun zarada za {payrollEmployees} zaposlenih u {payrollBranches} filijala, uveo timski razvoj sa Git-om i napisao korporativne standarde koda."
        - "Od {movedToSerbiaYear}. godine Stas živi u Srbiji i radi u međunarodnim produktnim timovima: prvo u 1C Romania, sada u SOFTSWISS-u na poziciji Senior 1C Developer."
        - "Stas vodi dva autorska kursa za 1C programere: „AI arsenal za 1C programera“ i „Git i GitHub u 1C razvoju“. Završilo ih je {graduates|polaznik|polaznika|polaznika}. Održao je {talks|predavanje|predavanja|predavanja}, od toga dva na Infostart Event-u, i napisao {articles|članak|članka|članaka}. Članak o Git-u i 1C-u nominovan je za „Članak godine 2019“ na Infostartu. Suosnivač je IT zajednice DevDV na ruskom Dalekom istoku, organizovao je {conferencesTotal|konferenciju|konferencije|konferencija}: {conferencesCorporate} korporativne i {conferencesOpen} otvorenih."

