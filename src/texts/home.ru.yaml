about:
  portrait_alt: "Стас Ганиев, портрет"
  story:
    - "В десятом классе я писал алгоритмы карандашом в тетради: компьютеров в школе не было. Дома стоял ZX Spectrum, подключённый к ламповому телевизору. Моя первая программа рисовала звёздочку, которая двигалась по синусоиде." # A1
    - "{firstReportDayMonth} {sinceYear} года я написал первый отчёт в 1С 7.7. С тех пор поработал разработчиком, тестировщиком, аналитиком, руководителем проектов, архитектором и руководителем группы." # A2
    - "В {movedToSerbiaYear} году мы с женой и детьми переехали из Хабаровска в Сербию. Живу в Нови-Саде, работаю в международной команде и пишу код на английском." # A3
    - "Люблю объяснять сложное так, чтобы стало понятно. Отсюда курсы, доклады и статьи." # A4
  # A5. Поле photo: train, bachata, avacha, contest, plane, twins. Без alt фото считается оформлением.
  facts:
    - photo: train
      text: "На первый компьютер заработал проводником поезда Хабаровск – Москва."
    - photo: bachata
      alt: "Стас с женой перед массовым танцем бачата"
      text: "Участвовал в рекорде Гиннесса: самый массовый парный танец бачата, 2014 год."
    - photo: avacha
      alt: "Стас на Авачинском вулкане, за спиной заснеженная вершина"
      text: "Поднялся на Авачинский вулкан на Камчатке."
    - photo: contest
      alt: "Снимок Стаса, победивший в конкурсе журнала Digital Photo"
      text: "Победил в читательском фотоконкурсе журнала Digital Photo. Этот снимок напечатали в номере."
    - photo: plane
      text: "Летал вторым пилотом на сверхлёгком самолёте."
    - photo: twins
      text: "Отец двойни."

