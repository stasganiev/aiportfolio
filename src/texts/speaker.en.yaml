bio:
  title: "Bio" # S2
  copy: "Copy"
  copied: "Copied"
  variants:
    - label: "One line" # S3
      text:
        - "Stas Ganiev, Senior 1C Developer at SOFTSWISS, author of the courses “AI Arsenal for the 1C Developer” and “Git and GitHub in 1C Development”."
    - label: "Paragraph" # S4
      text:
        - "Stas Ganiev has worked with 1C since {sinceYear}. He went from a programmer at a 1C franchisee to architect and head of a development team at the largest retail holding in the Russian Far East. He is now a Senior 1C Developer at SOFTSWISS, an international product company, and lives in Serbia. He is the author of two courses for 1C developers, completed by {graduates|person|people}. He has given {talks|talk|talks}, including two at Infostart Event, and written {articles|article|articles}."
    - label: "Half a page" # S5
      text:
        - "Stas Ganiev has worked with 1C since {sinceYear}. He started at 1C franchisees, where he implemented standard configurations and became the training centre's first instructor. He spent nine years at Nevada, the largest retail holding in the Russian Far East: he headed the development team, implemented payroll calculation for {payrollEmployees} employees across {payrollBranches} branches, introduced team development with Git and wrote the corporate coding standards."
        - "Since {movedToSerbiaYear} Stas has lived in Serbia and worked in international product teams: first at 1C Romania, now at SOFTSWISS as a Senior 1C Developer."
        - "Stas teaches two courses of his own for 1C developers: “AI Arsenal for the 1C Developer” and “Git and GitHub in 1C Development”. {graduates|person has|people have} completed them. He has given {talks|talk|talks}, including two at Infostart Event, and written {articles|article|articles}. His article on Git and 1C was nominated for Article of the Year 2019 at Infostart. He is a co-founder of DevDV, an IT community in the Russian Far East, and has organised {conferencesTotal|conference|conferences}: {conferencesCorporate} corporate and {conferencesOpen} open."

topics:
  title: "Talk topics" # S6
  items:
    - title: "From Code to Commercial Proposal: How to Build an AI Pipeline for Any Business Process"
      text: "Six questions that help you take your own process apart and see where AI fits in. Based on three working examples: 1C development, course production and family finances. For managers and teams."
    - title: "The Economics of AI in a 1C Project"
      text: "AI has sped up development. Why has the project not become cheaper by the same factor? The full cost of AI development: tokens, hours and rework. For project managers and business owners."
  format: "Format: 30–40 minutes, in person or online. I speak in Russian." # S7

