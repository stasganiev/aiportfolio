about:
  portrait_alt: "Stas Ganiev, portrait"
  story:
    - "In tenth grade I wrote algorithms in pencil in a notebook: the school had no computers. At home there was a ZX Spectrum plugged into a tube TV. My first program drew a star that moved along a sine wave." # A1
    - "On {firstReportDayMonth}, {sinceYear}, I wrote my first report in 1C 7.7. Since then I have worked as a developer, tester, analyst, project manager, architect and team lead." # A2
    - "In {movedToSerbiaYear} my wife, our children and I moved from Khabarovsk to Serbia. I live in Novi Sad, work in an international team and write code in English." # A3
    - "I like explaining complex things so that they become clear. That is where the courses, talks and articles come from." # A4
  # A5. Поле photo: train, bachata, avacha, contest, plane, twins. Без alt фото считается оформлением.
  facts:
    - photo: train
      text: "I earned the money for my first computer as a train attendant on the Khabarovsk–Moscow route."
    - photo: bachata
      alt: "Stas and his wife before the mass bachata dance"
      text: "Took part in a Guinness World Record: the largest bachata couples dance, 2014."
    - photo: avacha
      alt: "Stas on Avachinsky volcano, a snow-covered summit behind him"
      text: "Climbed Avachinsky volcano in Kamchatka."
    - photo: contest
      alt: "The photo by Stas that won the Digital Photo magazine contest"
      text: "Won the readers' photo contest of Digital Photo magazine. This shot was printed in the issue."
    - photo: plane
      text: "Flew as co-pilot of an ultralight aircraft."
    - photo: twins
      text: "Father of twins."

