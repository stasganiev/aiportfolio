# Тексты главной на английском. Перевод с мастер-версии home.ru.yaml, термины по work/glossary.md.
# Коды в комментариях (H2, N1) совпадают с кодами абзацев в мастер-текстах.
#
# {graduates}, {talks} и другие имена в фигурных скобках подставляются из src/data/facts.yaml.
# {talks|talk|talks} ставит число и слово в нужной форме: «1 talk», «18 talks».
# {n} подставляет сам компонент.
# Звёздочки выделяют слова: *AI pipelines* показывается курсивом с акцентом.
# Формы числа в английском: one для 1, other для остальных.

