about:
  portrait_alt: "Stas Ganiev, portret"
  story:
    - "U desetom razredu pisao sam algoritme olovkom u svesci: u školi nije bilo računara. Kod kuće je stajao ZX Spectrum povezan na televizor sa lampama. Moj prvi program crtao je zvezdicu koja se kretala po sinusoidi." # A1
    - "Prvi izveštaj u 1C 7.7 napisao sam {firstReportDayMonth} {sinceYear}. godine. Od tada sam radio kao programer, tester, analitičar, rukovodilac projekata, arhitekta i rukovodilac tima." # A2
    - "Godine {movedToSerbiaYear}. sam se sa suprugom i decom preselio iz Habarovska u Srbiju. Živim u Novom Sadu, radim u međunarodnom timu i pišem kod na engleskom." # A3
    - "Volim da objašnjavam složene stvari tako da postanu jasne. Otuda kursevi, predavanja i članci." # A4
  # A5. Поле photo: train, bachata, avacha, contest, plane, twins. Без alt фото считается оформлением.
  facts:
    - photo: train
      text: "Za prvi računar zaradio sam kao pratilac vagona u vozu Habarovsk–Moskva."
    - photo: bachata
      alt: "Stas sa suprugom pre masovnog plesa bačate"
      text: "Učestvovao sam u Ginisovom rekordu: najmasovniji ples bačate u parovima, 2014. godine."
    - photo: avacha
      alt: "Stas na vulkanu Avačinski, iza njega je snežni vrh"
      text: "Popeo sam se na vulkan Avačinski na Kamčatki."
    - photo: contest
      alt: "Fotografija kojom je Stas pobedio na konkursu časopisa Digital Photo"
      text: "Pobedio sam na čitalačkom foto-konkursu časopisa Digital Photo. Ova fotografija je objavljena u broju."
    - photo: plane
      text: "Leteo sam kao kopilot na ultralakom avionu."
    - photo: twins
      text: "Otac blizanaca."

