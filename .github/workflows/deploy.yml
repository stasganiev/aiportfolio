name: Deploy to GitHub Pages

# Manual start only: the rebuild goes on in main, and a push must not
# publish a half-built site. Automatic deploy returns at release.
#
# Until release this workflow republishes the old site. Its files are gone
# from main, so the checkout takes the commit kept under the tag v2-legacy.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: e71c5886a75faae85eabfc66e06e26ac1a543fff

      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html 404.html robots.txt sitemap.xml css js img _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
